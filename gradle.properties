# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Use Java 21 for Gradle daemon (required for Kotlin SDK buildSrc)
org.gradle.java.home=/opt/homebrew/Cellar/openjdk@21/21.0.10/libexec/openjdk.jdk/Contents/Home

# Android properties
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Enable 16 KB page size support for Android 15+ (Google Play requirement)
android.lint.checkReleaseBuilds=false
android.experimental.lint.missingBaselineIsEmptyBaseline=true

# Kotlin
kotlin.code.style=official

# Allow Gradle to download missing Java toolchains
org.gradle.java.installations.auto-download=true

# Explicitly tell Gradle where to find Java installations
# This prevents Gradle from using Android Studio's JBR (which has a broken jlink)
org.gradle.java.installations.paths=/opt/homebrew/Cellar/openjdk@21/21.0.10/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/Cellar/openjdk@17/17.0.17/libexec/openjdk.jdk/Contents/Home
org.gradle.java.installations.fromEnv=JAVA_HOME
